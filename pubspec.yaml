name: repository
description: A reactive repository toolkit for Flutter with HTTP, caching, dependency tracking, auto refresh, and UI integration.
version: 4.0.0-dev.1
homepage: https://github.com/yanncabral/repository

environment:
  sdk: ">=3.12.0 <4.0.0"

workspace:
  - packages/repository_cache_hive

melos:
  useRootAsPackage: true
  scripts:
    format:
      description: Check formatting in every package.
      exec: dart format --output=none --set-exit-if-changed lib test
    analyze:
      description: Analyze every package.
      exec:
        command: flutter analyze --no-pub
        concurrency: 1
    test:
      description: Run tests in every package.
      exec:
        command: flutter test --no-pub
        concurrency: 1
    quality:
      description: Format, analyze, and test the complete workspace.
      steps:
        - format
        - analyze
        - test

dev_dependencies:
  flutter_test:
    sdk: flutter
  melos: ^8.3.0
  mocktail: ^1.0.4
  test: ^1.25.8
  very_good_analysis: ^10.0.0

dependencies:
  crypto: ^3.0.6
  cupertino_http: ">=2.3.0 <2.4.0"
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  http: ^1.4.0
  meta: ^1.16.0
  retry: ^3.1.2
  rxdart: ^0.28.0
