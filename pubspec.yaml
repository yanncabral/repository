name: repository
description: A reactive repository toolkit for Flutter with HTTP, caching, dependency tracking, auto refresh, and UI integration.
version: 4.0.0-dev.1
homepage: https://github.com/yanncabral/repository

environment:
  sdk: ">=3.12.0 <4.0.0"

workspace:
  - packages/repository_cache_hive

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  test: ^1.25.8
  very_good_analysis: ^10.0.0

dependencies:
  crypto: ^3.0.6
  cupertino_http: ">=2.3.0 <2.4.0"
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  http: ^1.4.0
  meta: ^1.16.0
  retry: ^3.1.2
  rxdart: ^0.28.0
